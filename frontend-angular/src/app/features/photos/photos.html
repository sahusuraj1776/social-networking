<app-main-layout>
  <h1 class="text-2xl font-semibold mb-6">Media</h1>

  <!-- ✅ Photo Grid -->
  <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
    @for (photo of photos(); track photo.id) {
      <div
        class="border border-gray-200 rounded shadow bg-white overflow-hidden hover:scale-105 transition hover:cursor-pointer"
      >
        @if (photo.type.startsWith('video')) {
            <video [src]="'http://localhost:4000/media/'+photo.url" controls class="w-full h-auto"></video>
            } @else {
            <img [src]="'http://localhost:4000/media/'+photo.url" class="w-full h-auto" />
            }
      </div>
    }
  </div>
</app-main-layout>
