<app-main-layout>
  <h1 class="ml-4 text-2xl font-semibold mb-6">Groups</h1>

  <div class="space-y-6">
    @for (group of groups; track group.id) {
      <div class="border border-gray-200 rounded shadow bg-white p-4 flex flex-col sm:flex-row gap-4">
        <!-- ✅ Icon -->
        <div class="flex items-start justify-center">
          <fa-icon
            [icon]="faUsers"
            class="text-black text-[55px]"
          ></fa-icon>
        </div>

        <!-- ✅ Group Info -->
        <div class="flex-1">
          <p class="text-sky-700 text-lg">{{ group.name }}</p>
          <p class="text-sm text-gray-800">{{ group.description }}</p>

          <button class="mt-3 bg-white border-2 border-gray-400 text-black px-4 py-1 rounded hover:bg-blue-600 hover:cursor-pointer">
            Join Group
          </button>
        </div>
      </div>
    }
  </div>
</app-main-layout>
