<div class="min-h-screen flex items-center justify-center bg-gray-100 p-4">
  <div class="bg-white shadow-lg p-8 rounded w-full max-w-md">

    <h2 class="text-2xl font-bold mb-6 text-center">Create Account</h2>

    <form [formGroup]="form" (ngSubmit)="handleSubmit()" class="space-y-4">

      <!-- Name -->
      <div>
        <label class="block text-sm font-semibold mb-1">Full Name</label>
        <input
          type="text"
          formControlName="name"
          placeholder="Enter your name"
          class="w-full border p-2 rounded"
        />
      </div>

      <!-- Email -->
      <div>
        <label class="block text-sm font-semibold mb-1">Email</label>
        <input
          type="email"
          formControlName="email"
          placeholder="Enter email"
          class="w-full border p-2 rounded"
        />
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm font-semibold mb-1">Password</label>
        <input
          type="password"
          formControlName="password"
          placeholder="Enter password"
          class="w-full border p-2 rounded"
        />
      </div>

      <!-- Signup Button -->
      <button
        type="submit"
        class="w-full bg-sky-900 text-white py-2 rounded hover:bg-sky-800 hover:cursor-pointer"
      >
        Sign Up
      </button>

    </form>

    <!-- Login Redirect -->
    <p class="text-center text-sm mt-4">
      Already have an account?
      <span
        (click)="goToLogin()"
        class="text-blue-600 cursor-pointer underline"
      >
        Login
      </span>
    </p>

  </div>
</div>
